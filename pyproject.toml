[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwam-migration-paperbot"
version = "0.1.0"
description = "Paper-only monitor for Pump.fun migrations from a configured creator wallet"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Enrico"}]
dependencies = []

[project.scripts]
bwam-paperbot = "bwam_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

